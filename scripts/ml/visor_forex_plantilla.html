<style>
/* Layout: mesa de instrumentos. Fila de control arriba, grafico grande a la izquierda y la "mente" del agente a la derecha; abajo lo que aprendio. */
:root {

  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e131a; --surface: #151c26; --surface2: #1a2330; --fg: #e3e8ef; --muted: #93a0b1; --line: #2a3443; --grid: #1f2834;
  --accent: #7d9cff; --accent-soft: #1f2a45;
  --up: #3fc79c; --up-soft: #12302a; --down: #f0716b; --down-soft: #3a1c1c; --hold: #e2a73e; --hold-soft: #3a2c13; --idle: #6b7686;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --surface2: #1a2330; --fg: #e3e8ef; --muted: #93a0b1; --line: #2a3443; --grid: #1f2834;
  --accent: #7d9cff; --accent-soft: #1f2a45;
  --up: #3fc79c; --up-soft: #12302a; --down: #f0716b; --down-soft: #3a1c1c; --hold: #e2a73e; --hold-soft: #3a2c13; --idle: #6b7686;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
h1 { font-size: 26px; font-weight: 700; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
header.top .sub { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 13px var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { color: #0e131a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { color: #0e131a; } }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.charts { display: flex; flex-direction: column; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 14px 0; flex-wrap: wrap; }
.chart-head .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
#cPrecio { height: 380px; }
#cAbajo { height: 150px; border-top: 1px solid var(--line); }
#cCartera { height: 150px; border-top: 1px solid var(--line); }
.replay { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface2); border-radius: 0 0 10px 10px; }
.replay .btn { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 7px; padding: 6px 10px; cursor: pointer; min-width: 36px; }
.replay .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 88px; }
.replay input[type=range] { flex: 1 1 200px; min-width: 0; accent-color: var(--accent); }
.replay .when { font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-width: 16ch; }
.mind { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
.mind .clock { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.mind .clock .t { font-family: var(--f-mono); font-size: 13px; }
.mind .clock .px { font-family: var(--f-mono); font-size: 18px; font-weight: 500; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 7px 0; border-top: 1px dashed var(--line); counter-increment: s; }
.steps li::before { content: counter(s); font: 600 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; }
.steps li.on::before { background: var(--accent); border-color: var(--accent); color: #fff; }
.steps .k { font-size: 12px; color: var(--muted); }
.steps .v { font-family: var(--f-mono); font-size: 13px; }
.verdict { border-radius: 8px; padding: 10px 12px; font-weight: 600; font-family: var(--f-display); font-size: 17px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.verdict small { font: 400 12px var(--f-body); }
.v-up { background: var(--up-soft); color: var(--up); }
.v-down { background: var(--down-soft); color: var(--down); }
.v-hold { background: var(--hold-soft); color: var(--hold); }
.v-idle { background: var(--surface2); color: var(--muted); }
.gauge { position: relative; height: 34px; }
.gauge .bar { position: absolute; left: 0; right: 0; top: 10px; height: 10px; border-radius: 5px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
.gauge .zone { position: absolute; top: 0; bottom: 0; }
.gauge .needle { position: absolute; top: 4px; width: 3px; height: 22px; margin-left: -1px; background: var(--fg); border-radius: 2px; transition: left 0.15s; }
.gauge .lab { position: absolute; top: 22px; font: 400 10px var(--f-mono); color: var(--muted); transform: translateX(-50%); }
.bars { display: flex; flex-direction: column; gap: 5px; }
.brow { display: grid; grid-template-columns: minmax(0, 140px) minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px; }
.brow .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; height: 14px; background: var(--surface2); border-radius: 3px; }
.track .mid { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.track .fill { position: absolute; top: 2px; bottom: 2px; border-radius: 2px; }
.vars { display: flex; flex-direction: column; gap: 8px; }
.var { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 12.5px; padding-bottom: 7px; border-bottom: 1px dashed var(--line); }
.var .read { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.push { font: 600 11px var(--f-mono); padding: 1px 6px; border-radius: 4px; white-space: nowrap; }
.push.up { background: var(--up-soft); color: var(--up); }
.push.down { background: var(--down-soft); color: var(--down); }
.outcome { font-size: 13px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--surface2); border-radius: 8px; padding: 8px 10px; }
.stat .n { font-family: var(--f-mono); font-size: 17px; font-weight: 500; }
.stat .l { font-size: 11px; color: var(--muted); }
.learn { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.learn .intro { color: var(--muted); max-width: 80ch; }
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mult { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--surface2); display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mult .ttl { font-weight: 600; font-size: 13px; }
.mult .cap { font-size: 12px; color: var(--muted); }
.mult svg { width: 100%; height: auto; display: block; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.how .card { padding: 12px 14px; }
.how .card p { color: var(--muted); font-size: 13px; margin-top: 6px; }
.note { font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--hold); padding: 6px 10px; background: var(--hold-soft); border-radius: 0 6px 6px 0; }
.note b { color: var(--fg); }
@media (prefers-reduced-motion: reduce) { .gauge .needle { transition: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Visor del agente forex</h1>
      <p class="sub" id="sub">Repite el mercado vela a vela y muestra, en cada momento, qu&#233; vio el agente, qu&#233; pens&#243; y qu&#233; decidi&#243;.</p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Agente" hidden>
        <button id="bIA" aria-pressed="true">Modelo IA (LightGBM 24h)</button>
        <button id="bE2" aria-pressed="false">Regla E2 (tendencia)</button>
      </div>
      <div class="seg" role="group" aria-label="Moneda" id="monedas"></div>
    </div>
  </header>

  <p class="note" id="nota"></p>

  <div class="grid">
    <section class="panel charts" aria-label="Gr&#225;ficos">
      <div class="chart-head"><h3 id="tPrecio">Precio</h3><div class="legend" id="leg1"></div></div>
      <div id="cPrecio"></div>
      <div class="chart-head" style="padding-top:8px"><h3 id="tAbajo">Probabilidad de subir en 2 horas</h3><div class="legend" id="leg2"></div></div>
      <div id="cAbajo"></div>
      <div id="bloqueCartera" hidden>
        <div class="chart-head" style="padding-top:8px"><h3>Cartera de 9 monedas (escala logar&#237;tmica, 1 = capital inicial)</h3><div class="legend" id="leg3"></div></div>
        <div id="cCartera"></div>
      </div>
      <div class="replay">
        <button class="btn" id="bAtras" title="Paso atr&#225;s" aria-label="Paso atr&#225;s">&#9664;</button>
        <button class="btn primary" id="bPlay">Reproducir</button>
        <button class="btn" id="bAdel" title="Paso adelante" aria-label="Paso adelante">&#9654;</button>
        <button class="btn" id="bSig" title="Saltar a la siguiente decisi&#243;n de operar">Siguiente operaci&#243;n</button>
        <div class="seg" role="group" aria-label="Velocidad" id="vel">
          <button data-v="1" aria-pressed="true">1&#215;</button><button data-v="4" aria-pressed="false">4&#215;</button><button data-v="16" aria-pressed="false">16&#215;</button>
        </div>
        <input type="range" id="slider" min="0" max="10" value="0" aria-label="Momento del mercado">
        <span class="when" id="when"></span>
      </div>
    </section>

    <aside class="panel mind" aria-label="Lo que piensa el agente" id="mente"></aside>
  </div>

  <section class="panel learn" id="aprendio"></section>

  <section class="how" id="como"></section>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const D = /*__DATOS__*/null;
const M = D.meta;
for (const m in D.ia) for (const d of D.ia[m].dec) d[5] = d[5].map(([ki, v, c]) => [M.claves[ki], v, c]);
const DIAS = ['lunes', 'martes', 'mi\u00e9rcoles', 'jueves', 'viernes', 's\u00e1bado', 'domingo'];
const st = { agente: 'ia', moneda: 'XAUUSD', i: 0, play: false, vel: 1, timer: null };
const $ = (id) => document.getElementById(id);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- formato
function fecha(t, conHora) {
  const d = new Date(t * 1000);
  const p = (n) => String(n).padStart(2, '0');
  const s = d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate());
  return conHora ? s + ' ' + p(d.getUTCHours()) + ':00 UTC' : s;
}
function horaCol(t) { const d = new Date((t - 5 * 3600) * 1000); let h = d.getUTCHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':00 ' + ap + ' Colombia'; }
function precio(v) { if (v == null) return '\u2013'; const a = Math.abs(v); const d = a >= 1000 ? 2 : a >= 20 ? 3 : 5; return v.toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function pct(v, d = 1) { return (v >= 0 ? '+' : '\u2212') + Math.abs(v * 100).toFixed(d) + '%'; }
function sg(v) { return (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(1) + '\u03c3'; }
const sigm = (x) => 1 / (1 + Math.exp(-x));

function valorTxt(k, v, t) {
  if (v == null) return 'sin dato';
  const u = M.unidad[k];
  if (u === 'sigma') return sg(v);
  if (u === 'pct') return (v * 100).toFixed(2) + '% por hora';
  if (u === 'x') return v.toFixed(2) + '\u00d7';
  if (u === 'frac') return (v >= 0 ? '+' : '\u2212') + Math.abs(v).toFixed(2);
  if (u === 'num') return v.toFixed(0);
  if (u === 'pct01' || u === 'frac01') return (v * 100).toFixed(0) + '%';
  if (u === 'si') return v ? 's\u00ed' : 'no';
  if (u === 'hora') return new Date(t * 1000).getUTCHours() + ':00 UTC';
  if (u === 'dia') return DIAS[v] || v;

}
function lectura(k, v, t) {
  if (v == null) return 'Sin dato en esta vela.';
  const mov = (x, quien) => x > 1.5 ? quien + ' subi\u00f3 fuerte' : x > 0.5 ? quien + ' subi\u00f3' : x < -1.5 ? quien + ' cay\u00f3 fuerte' : x < -0.5 ? quien + ' cay\u00f3' : quien + ' casi no se movi\u00f3';
  const plazo = { r1: 'en la \u00faltima hora', r2: 'en 2 horas', r3: 'en 3 horas', r4: 'en 4 horas', r6: 'en 6 horas', r12: 'en 12 horas', r24: 'en 24 horas', r120: 'en 5 d\u00edas' };
  if (plazo[k]) return mov(v, 'El precio') + ' ' + plazo[k] + ' (medido en desviaciones de su volatilidad).';
  if (k.startsWith('x_')) return mov(v, k.slice(2, k.lastIndexOf('_'))) + (k.endsWith('r1') ? ' en la \u00faltima hora.' : ' en 6 horas.');
  switch (k) {
    case 'rsi14': return v > 70 ? 'Sobrecomprado: subi\u00f3 mucho seguido.' : v < 30 ? 'Sobrevendido: cay\u00f3 mucho seguido.' : 'RSI en zona neutra.';
    case 'bb20': return v > 2 ? 'Por encima de la banda alta de Bollinger.' : v < -2 ? 'Por debajo de la banda baja de Bollinger.' : v > 0 ? 'En la mitad alta de las bandas.' : 'En la mitad baja de las bandas.';
    case 'dist_max168': return v > -1 ? 'Muy cerca del m\u00e1ximo de la semana.' : v > -3 ? 'Algo por debajo del m\u00e1ximo de la semana.' : 'Lejos del m\u00e1ximo de la semana.';
    case 'dist_min168': return v < 1 ? 'Muy cerca del m\u00ednimo de la semana.' : v < 3 ? 'Algo por encima del m\u00ednimo de la semana.' : 'Lejos del m\u00ednimo de la semana.';
    case 'vol_rel': return v > 1.5 ? 'Se negocia mucho m\u00e1s volumen que lo normal.' : v < 0.7 ? 'Se negocia menos volumen que lo normal.' : 'Volumen normal.';
    case 'oper_rel': return v > 1.5 ? 'Muchas m\u00e1s operaciones que lo normal.' : v < 0.7 ? 'Menos operaciones que lo normal.' : 'N\u00famero de operaciones normal.';
    case 'compra_ag_1h': case 'compra_ag_24h': return v > 0.55 ? 'Dominan los compradores agresivos.' : v < 0.45 ? 'Dominan los vendedores agresivos.' : 'Compradores y vendedores parejos.';
    case 'vol_razon': return v > 1.3 ? 'M\u00e1s agitado hoy que en la semana.' : v < 0.8 ? 'M\u00e1s calmado hoy que en la semana.' : 'Agitaci\u00f3n normal.';
    case 'vol24': return 'Cu\u00e1nto se mueve el precio por hora en el \u00faltimo d\u00eda.';
    case 'vol120': return 'Cu\u00e1nto se mueve el precio por hora en los \u00faltimos 5 d\u00edas.';
    case 'ema_dif': return v > 0.5 ? 'MACD positivo: la media r\u00e1pida va sobre la lenta.' : v < -0.5 ? 'MACD negativo: la media r\u00e1pida va bajo la lenta.' : 'MACD casi en cero.';
    case 'cci20': return v > 100 ? 'CCI alto: precio estirado hacia arriba.' : v < -100 ? 'CCI bajo: precio estirado hacia abajo.' : 'CCI en zona normal.';
    case 'dist_max24': return v > -1 ? 'Muy cerca del m\u00e1ximo de 24 horas.' : 'Por debajo del m\u00e1ximo de 24 horas.';
    case 'dist_min24': return v < 1 ? 'Muy cerca del m\u00ednimo de 24 horas.' : 'Por encima del m\u00ednimo de 24 horas.';
    case 'mecha_sup': return v > 0.5 ? 'Mecha superior larga: rechazaron el precio arriba.' : 'Mecha superior corta.';
    case 'mecha_inf': return v > 0.5 ? 'Mecha inferior larga: rechazaron el precio abajo.' : 'Mecha inferior corta.';
    case 'noticia_prox2h': return v ? 'Hay una noticia de EE. UU. en las pr\u00f3ximas 2 horas.' : 'Sin noticias de EE. UU. en las pr\u00f3ximas 2 horas (el calendario cargado llega a 2024).';
    case 'noticia_ult2h': return v ? 'Hubo una noticia de EE. UU. en las \u00faltimas 2 horas.' : 'Sin noticias de EE. UU. en las \u00faltimas 2 horas (el calendario cargado llega a 2024).';
    case 'rango': return v > 2 ? 'Vela muy amplia para lo normal.' : 'Amplitud de la \u00faltima vela de 1h.';
    case 'cuerpo': return v > 0.5 ? 'La \u00faltima vela cerr\u00f3 cerca de su m\u00e1ximo.' : v < -0.5 ? 'La \u00faltima vela cerr\u00f3 cerca de su m\u00ednimo.' : 'Vela indecisa.';
    case 'hora_sin': case 'hora_cos': return 'La hora del d\u00eda en que decide.';
    case 'dia': return 'El d\u00eda de la semana en que decide.';
  }
  return '';
}
const TILDES = [['Posicion', 'Posici\u00f3n'], ['ultimas', '\u00faltimas'], ['ultima', '\u00faltima'], ['proximas', 'pr\u00f3ximas'], ['Que mercado', 'Qu\u00e9 mercado'], ['Que moneda', 'Qu\u00e9 moneda'], [' dias', ' d\u00edas'], ['maximo', 'm\u00e1ximo'], ['minimo', 'm\u00ednimo'], ['Dia de', 'D\u00eda de'], ['Hora y dia', 'Hora y d\u00eda'], ['Hora del dia', 'Hora del d\u00eda']];
function tilde(s) { return TILDES.reduce((x, [a, b]) => x.split(a).join(b), s); }

function nombreVar(k) { return tilde(M.nombres[k] || k); }

// ---------- graficos
const LW = LightweightCharts;
let chP, chA, chC, sVelas, sMedia, sProb, sPeso, sE2, sH1, sBH, lineas = [];
function opcionesTema() {
  return {
    layout: { background: { type: 'solid', color: css('--surface') }, textColor: css('--muted'), fontFamily: 'IBM Plex Mono, monospace', fontSize: 11 },
    grid: { vertLines: { color: css('--grid') }, horzLines: { color: css('--grid') } },
    rightPriceScale: { borderColor: css('--line') }, timeScale: { borderColor: css('--line'), timeVisible: true, secondsVisible: false },
    crosshair: { mode: 0 },

}
function crear() {
  [chP, chA, chC].forEach((c) => c && c.remove());
  chP = LW.createChart($('cPrecio'), Object.assign({ autoSize: true }, opcionesTema()));
  chA = LW.createChart($('cAbajo'), Object.assign({ autoSize: true }, opcionesTema()));
  chC = null;
  const ult = (st.agente === 'ia' ? serieIA().velas : serieE2()).slice(-1)[0][4];
  const dec = ult >= 1000 ? 2 : ult >= 20 ? 3 : 5;
  sVelas = chP.addCandlestickSeries({ upColor: css('--up'), downColor: css('--down'), wickUpColor: css('--up'), wickDownColor: css('--down'), borderVisible: false,
    priceFormat: { type: 'price', precision: dec, minMove: Math.pow(10, -dec) } });
  sMedia = null; sProb = null; sPeso = null;

function alinearCartera() {

  const tA = S[Math.max(0, Math.min(S.length - 1, Math.round(r.from)))][0], tB = S[Math.max(0, Math.min(S.length - 1, Math.round(r.to)))][0];

function buscarVela(velas, t) { let lo = 0, hi = velas.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (velas[m][0] <= t) lo = m; else hi = m - 1; } return lo; }

// ---------- lo que aprendio (curvas de dependencia)
function curva(k, pts) {
  const W = 260, H = 120, P = { l: 30, r: 8, t: 8, b: 22 };
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const yA = Math.max(0.05, ...ys.map(Math.abs));
  const X = (x) => P.l + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - P.l - P.r);
  const Y = (y) => P.t + (1 - (y + yA) / (2 * yA)) * (H - P.t - P.b);
  const path = pts.map((p, j) => (j ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
  const area = path + ` L ${X(x1).toFixed(1)} ${Y(0).toFixed(1)} L ${X(x0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const fmt = (x) => k === 'dia' ? DIAS[x].slice(0, 3) : k === 'hora' ? x + 'h' : M.unidad[k] === 'si' ? (x ? 's\u00ed' : 'no') : M.unidad[k] === 'pct01' ? (x * 100).toFixed(0) + '%' : M.unidad[k] === 'pct' ? (x * 100).toFixed(2) + '%' : Math.abs(x) >= 10 ? x.toFixed(0) : x.toFixed(1);
  const dots = pts.map((p) => `<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="2.2" fill="var(${p[1] >= 0 ? '--up' : '--down'})"></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Efecto de ${k}">
    <line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1"></line>
    <path d="${area}" fill="var(--accent-soft)" opacity="0.7"></path>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.8"></path>${dots}
    <text x="${P.l - 4}" y="${Y(yA) + 4}" text-anchor="end" font-size="9" fill="var(--up)" font-family="IBM Plex Mono, monospace">sube</text>
    <text x="${P.l - 4}" y="${Y(-yA)}" text-anchor="end" font-size="9" fill="var(--down)" font-family="IBM Plex Mono, monospace">baja</text>
    <text x="${P.l}" y="${H - 6}" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmt(x0)}</text>
    <text x="${W - P.r}" y="${H - 6}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fmt(x1)}</text>
  </svg>`;
}
function leyendaCurva(k, pts) {
  if (k === 'dia' || k === 'hora') {
    const mx = pts.reduce((a, b) => (b[1] > a[1] ? b : a)), mn = pts.reduce((a, b) => (b[1] < a[1] ? b : a));
    const f = (x) => k === 'dia' ? DIAS[x] : x + ':00 UTC';
    return `M\u00e1s alcista el ${f(mx[0])}, m\u00e1s bajista el ${f(mn[0])}.`;
  }
  if (M.unidad[k] === 'si' && pts.length === 2) return pts[1][1] > pts[0][1] ? 'Con noticia empuja m\u00e1s hacia "sube".' : 'Con noticia empuja m\u00e1s hacia "baja".';
  const n = pts.length, a = pts.slice(0, Math.max(1, Math.floor(n / 4))), b = pts.slice(n - Math.max(1, Math.floor(n / 4)));
  const ma = a.reduce((s, p) => s + p[1], 0) / a.length, mb = b.reduce((s, p) => s + p[1], 0) / b.length;
  if (Math.abs(mb - ma) < 0.03) return 'Efecto peque\u00f1o o mixto.';
  return mb < ma ? 'Valores altos empujan a "baja" y bajos a "sube": apuesta a que el movimiento se devuelva.' : 'Valores altos empujan a "sube": apuesta a que el movimiento contin\u00fae.';
}
function pintarAprendio() {
  const imp = Object.entries(M.importancia).sort((a, b) => b[1] - a[1]);
  const maxI = imp[0][1];
  const fam = M.familias.map((f, k) => [f, M.importancia_familia[k]]).sort((a, b) => b[1] - a[1]);
  const maxF = fam[0][1];
  const top = imp.slice(0, 9).map(([k]) => k);
  const nom = (k) => k === 'hora' ? 'Hora del d\u00eda' : nombreVar(k);
  $('aprendio').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:6px"><h2>Lo que aprendi\u00f3 el modelo</h2>
    <p class="intro">El modelo no elige entre estrategias como un humano. Aprendi\u00f3, con datos de 2003 a 2024, cu\u00e1nto debe empujar cada variable seg\u00fan su valor, y en cada vela suma esos empujes. Las curvas muestran ese empuje medio (7 mercados, velas de Deriv desde abril 2024): encima de la l\u00ednea empuja a "sube", debajo a "baja".</p></div>
    <div class="how">
      <div><h3 style="margin-bottom:8px">Peso por grupo</h3><div class="bars">${fam.map(([f, v]) => `<div class="brow"><span class="name">${f}</span><div class="track"><div class="fill" style="left:0;width:${v / maxF * 100}%;background:var(--accent)"></div></div></div>`).join('')}</div></div>
      <div><h3 style="margin-bottom:8px">Las variables que m\u00e1s usa</h3><div class="bars">${imp.slice(0, 8).map(([k, v]) => `<div class="brow"><span class="name">${nom(k)}</span><div class="track"><div class="fill" style="left:0;width:${v / maxI * 100}%;background:var(--accent)"></div></div></div>`).join('')}</div></div>
    </div>
    <div class="multiples">${top.map((k) => `<div class="mult"><span class="ttl">${nom(k)}</span>${curva(k, M.dependencia[k])}<span class="cap">${leyendaCurva(k, M.dependencia[k])}</span></div>`).join('')}</div>`;
}

function pintarComo() {
  const ia = [
    ['Qu\u00e9 mira', 'Al cierre de cada hora toma las velas de 1h de EUR/USD, GBP/JPY, GBP/USD, USD/CHF, USD/JPY, oro y plata y calcula 47 variables: impulso, posici\u00f3n en su rango, volatilidad, forma de la vela, hora, d\u00eda, noticias de EE. UU. y lo que hicieron los otros mercados.'],
    ['C\u00f3mo decide', '300 \u00e1rboles de decisi\u00f3n, entrenados con datos de Dukascopy de 2003 a marzo 2024, convierten esas variables en una probabilidad de que el precio suba en 2 horas.'],
    ['Cu\u00e1ndo opera', 'Solo cuando la probabilidad se aleja de 50% m\u00e1s que el umbral (el 5% de casos m\u00e1s claros), si Deriv vende el contrato a esa hora y no hay otra operaci\u00f3n abierta en ese mercado. Compra un CALL si cree que sube o un PUT si cree que baja, de 2 horas.'],
    ['C\u00f3mo le va', 'En las pruebas acertaba m\u00e1s de 58% casi solo en las horas que Deriv bloquea (cambio de d\u00eda del mercado). En las horas comprables qued\u00f3 cerca de 53%, por debajo del 58% que exige el pago. Sigue en forward test en papel como control. No es asesor\u00eda financiera.'],
  ];
  const e2 = [
    ['Qu\u00e9 mira', 'Una vez al d\u00eda, al cierre UTC, el precio de cierre de cada una de las 9 monedas, su media de 50 d\u00edas y su volatilidad de 30 d\u00edas.'],
    ['C\u00f3mo decide', 'Compra la moneda si cierra por encima de su media de 50 d\u00edas; si no, se queda fuera en USDT. No intenta adivinar el siguiente movimiento.'],
    ['Cu\u00e1nto pone', 'Reparte el capital entre las 9 monedas y reduce el tama\u00f1o cuando la volatilidad pasa de 50% anual. As\u00ed invierte menos cuando el mercado est\u00e1 m\u00e1s peligroso.'],
    ['C\u00f3mo le fue', 'En las pruebas perdi\u00f3 mucho menos que comprar y mantener en las ca\u00eddas (31% frente a 67% en la reserva ciega). Hoy corre en papel, sin dinero. No es asesor\u00eda financiera.'],
  ];
  $('como').innerHTML = (st.agente === 'ia' ? ia : e2).map(([a, b]) => `<div class="panel card"><h3>${a}</h3><p>${b}</p></div>`).join('');
}

// ---------- controles
function vista() {
  $('bIA').setAttribute('aria-pressed', st.agente === 'ia'); $('bE2').setAttribute('aria-pressed', st.agente === 'e2');
  $('monedas').innerHTML = Object.keys(D.ia).map((m) => `<button data-m="${m}" aria-pressed="${m === st.moneda}">${m}</button>`).join('');
  $('monedas').querySelectorAll('button').forEach((b) => b.onclick = () => { st.moneda = b.dataset.m; parar(); vista(); });
  const ia = st.agente === 'ia';
  $('tPrecio').textContent = ia ? `${st.moneda} \u00b7 velas de 1 hora (Deriv)` : `${st.moneda}/USDT \u00b7 velas diarias y media de 50 d\u00edas`;
  $('tAbajo').textContent = ia ? 'Probabilidad de subir en 2 horas seg\u00fan el modelo' : `Peso de ${st.moneda} en la cartera (% del capital)`;
  $('leg1').innerHTML = ia
    ? `<span><i class="dot" style="background:var(--up)"></i>CALL</span><span><i class="dot" style="background:var(--down)"></i>PUT</span><span><i class="dot" style="background:var(--hold)"></i>ignorada (ya abierta)</span><span><i class="dot" style="background:var(--idle);border-radius:2px"></i>hora bloqueada en Deriv</span><span>c\u00edrculo = vencimiento (verde gana, rojo pierde)</span>`
    : `<span><i class="dot" style="background:var(--accent)"></i>media de 50 d\u00edas</span><span><i class="dot" style="background:var(--up)"></i>entra</span><span><i class="dot" style="background:var(--down)"></i>sale</span>`;
  $('leg2').innerHTML = ia ? '<span>l\u00edneas punteadas = umbrales para operar</span>' : '';
  $('leg3').innerHTML = `<span><i class="dot" style="background:var(--accent)"></i>E2</span><span><i class="dot" style="background:var(--hold)"></i>tendencia simple</span><span><i class="dot" style="background:var(--idle)"></i>comprar y mantener</span>`;
  $('bloqueCartera').hidden = ia;
  $('cAbajo').style.height = ia ? '150px' : '110px';
  $('bSig').textContent = ia ? 'Siguiente operaci\u00f3n' : 'Siguiente cambio';
  $('nota').innerHTML = ia
    ? '<b>Modelo en forward test en papel.</b> Velas reales de Deriv de noviembre 2025 a noviembre 2026, que el modelo nunca vio (se entren\u00f3 con Dukascopy hasta marzo 2024). Pago de Rise/Fall 72,45%: necesita acertar 58% para no perder. La mayor\u00eda de sus se\u00f1ales caen de 20:00 a 23:59 UTC, cuando Deriv no deja comprar.'
    : '<b>Regla en forward test en papel.</b> Datos diarios de Binance desde 2019 (backtest). Desde el 18 de noviembre de 2026 la misma regla se registra a diario sin dinero.';
  $('aprendio').hidden = !ia;
  crear();
  if (st.agente === 'ia') { const dec = serieIA().dec; const ops = dec.map((d, k) => [d, k]).filter(([d]) => d[2] === 1 || d[2] === -1); st.i = ops.length > 12 ? ops[12][1] : 200; }
  else { st.i = Math.min(largo() - 1, Math.max(0, serieE2().findIndex((d) => d[0] >= Date.UTC(2021, 3, 20) / 1000))); }
  pintarComo();
  pintar(true);
}
function parar() { st.play = false; clearInterval(st.timer); $('bPlay').textContent = 'Reproducir'; }
function jugar() {
  if (st.play) return parar();
  st.play = true; $('bPlay').textContent = 'Pausa';
  st.timer = setInterval(() => { if (st.i >= largo() - 1) return parar(); st.i += st.vel; pintar(); }, 140);
}
function siguiente() {
  parar();
  if (st.agente === 'ia') { const dec = serieIA().dec; for (let j = st.i + 1; j < dec.length; j++) if (dec[j][2] === 1 || dec[j][2] === -1) { st.i = j; break; } }
  else { const s = serieE2(); for (let j = st.i + 1; j < s.length; j++) if (s[j][7] !== s[j - 1][7]) { st.i = j; break; } }
  pintar();
}
$('bIA').onclick = () => { parar(); st.agente = 'ia'; vista(); };
$('bE2').onclick = () => { parar(); st.agente = 'e2'; vista(); };
$('bPlay').onclick = jugar;
$('bAdel').onclick = () => { parar(); st.i++; pintar(); };
$('bAtras').onclick = () => { parar(); st.i--; pintar(); };
$('bSig').onclick = siguiente;
$('slider').oninput = (e) => { parar(); st.i = +e.target.value; pintar(); };
$('vel').querySelectorAll('button').forEach((b) => b.onclick = () => { st.vel = +b.dataset.v; $('vel').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); });
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowRight') { parar(); st.i++; pintar(); } else if (e.key === 'ArrowLeft') { parar(); st.i--; pintar(); } else if (e.key === ' ') { e.preventDefault(); jugar(); }
});
const retema = () => { const i = st.i; vista(); st.i = i; pintar(true); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retema);
new MutationObserver(retema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
pintarAprendio();
vista();
</script>
